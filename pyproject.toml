[project]
name = "rebuild"
version = "0.1.0"
description = "rebuild is good"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "appstoreconnect>=0.10.1",
    "bcrypt>=4.3.0",
    "cloudscraper>=1.2.71",
    "cryptography>=46.0.3",
    "flask-cors>=6.0.1",
    "flask>=3.1.2",
    "gunicorn>=23.0.0; sys_platform != 'win32'",
    "hvac>=2.3.0",
    "keyring>=25.0.0",
    "minio>=7.2.20",
    "openssh-wrapper>=0.4",
    "opn-api>=0.4.0",
    "paramiko>=4.0.0",
    "prompt-toolkit>=3.0",
    "proxmoxer>=2.2.0",
    "pygithub>=1.54.1",
    "pyinfra>=3.9.2",
    "python-gitlab>=6.5.0",
    "requests-cache>=1.3.3",
    "requests>=2.32.5",
    "rope>=1.14.0",
    "ruamel-yaml>=0.17.10",
    "tomli-w>=1.2.0",
    "waitress>=3.0.0; sys_platform == 'win32'",
    "xattr>=1.2.0; sys_platform != 'win32'",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.16.0",
    "pytest>=8.4.2",
    "pytest-testmon>=2.1.3",
]

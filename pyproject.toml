[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "rebuild"
dynamic = ["version"]
description = "rebuild is good"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "appstoreconnect>=0.10.1",
    "bat",
    "bcrypt>=4.3.0",
    "bes",
    "bgit",
    "bnet",
    "bsecret",
    "cloudscraper>=1.2.71",
    "cryptography>=46.0.3",
    "flask-cors>=6.0.1",
    "flask>=3.1.2",
    "gunicorn>=23.0.0; sys_platform != 'win32'",
    "hvac>=2.3.0",
    "keyring>=25.0.0",
    "minio>=7.2.20",
    "openssh-wrapper>=0.4",
    "opn-api>=0.4.0",
    "paramiko>=4.0.0",
    "prompt-toolkit>=3.0",
    "proxmoxer>=2.2.0",
    "pygithub>=1.54.1",
    "pyinfra>=3.9.2",
    "python-gitlab>=6.5.0",
    "requests-cache>=1.3.3",
    "requests>=2.32.5",
    "rope>=1.14.0",
    "ruamel-yaml>=0.17.10",
    "tomli-w>=1.2.0",
    "waitress>=3.0.0; sys_platform == 'win32'",
    "xattr>=1.2.0; sys_platform != 'win32'",
]

[tool.uv.sources]
# Sibling checkouts, resolved editable in dev (see
# ~/proj/bat/claude-docs/uv-dependencies.md §4/§12).
bat = { path = "../bat", editable = true }
bes = { path = "../bes", editable = true }
bgit = { path = "../bgit", editable = true }
bnet = { path = "../bnet", editable = true }
bsecret = { path = "../bsecret", editable = true }

[dependency-groups]
dev = [
    "pyinstaller>=6.16.0",
    "pytest>=8.4.2",
    "pytest-testmon>=2.1.3",
]

[tool.pytest.ini_options]
# Without this, a bare "./t" (no path args) has pytest recurse into
# lib/ too, not just tests/ -- and lib/rebuild/_testing/fake_package_unit_test.py
# (a plain helper class, not a unittest.TestCase, zero real test_* items)
# matches pytest's default "*_test.py" collection glob purely by naming
# coincidence. Since lib/__init__.py exists (an old, otherwise-inert
# leftover -- lib/ itself is never meant to be an importable package,
# just a sys.path entry), pytest's package-root walk for that
# accidentally-collected file resolves its dotted module name as
# "lib.rebuild._testing.fake_package_unit_test" instead of
# "rebuild._testing.fake_package_unit_test". Its relative imports cascade
# that "lib."-prefixed identity into fake_package_source.py too, which
# does a module-level check.register_class(fake_package_source) --
# registering it under the wrong module identity once, then colliding
# with itself when a real test file later imports the same class
# normally (rebuild._testing.fake_package_source, no "lib." prefix),
# re-running that same registration under a second, different module
# identity: "check already has a method named ... for
# lib.rebuild._testing.fake_package_source". Root-caused via tracing
# every check.register_class("fake_package_source") call's full
# import-time stack. Nothing of value lives outside tests/, so scoping
# collection there is a real fix, not a workaround for a symptom.
testpaths = ["tests"]

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
local_scheme = "no-local-version"

[tool.hatch.build.hooks.vcs]
version-file = "lib/rebuild/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["lib/rebuild"]
exclude = [".#*"]
